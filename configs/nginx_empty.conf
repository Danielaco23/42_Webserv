server {
	listen 8901;                        # listening port, mandatory parameter
	root docs/TESTING;              # root folder of site directory, full or relative path, mandatory parameter
	host 127.127.127.127;                     # host or 127.0.0.1 by default
	server_name HELLO_THIS_IS_A_TEST;                   # specify server_name, need to be added into /etc/hosts to work
	error_page 405 /error/405.html;     # default error page
	error_page 406 /error/406.html;     # default error page
	client_max_body_size 1234567;          # max request body size in bytes
	index THISISATEST.html;                   # default page when requesting a directory, index.html by default

	location /tours {                   
		root docs/fusion_web;           # root folder of the location, if not specified, taken from the server. 
										# EX: - URI /tours           --> docs/fusion_web/tours
										#     - URI /tours/page.html --> docs/fusion_web/tours/page.html 
		autoindex on;                   # turn on/off directory listing
		allow_methods POST GET;         # allowed methods in location, GET only by default
		index www/equisde/index.html;               # default page when requesting a directory, copies root index by default
		return abc/index1.html;         # redirection
		alias  docs/fusion_web;         # replaces location part of URI. 
										# EX: - URI /tours           --> docs/fusion_web
										#     - URI /tours/page.html --> docs/fusion_web/page.html 
	}

	location cgi-bin {
		root ./;                             # cgi-bin location, mandatory parameter
		cgi_ext .py .sh;                     # extensions for executable files, mandatory parameter
		cgi_path /usr/bin/python3 /bin/bash; # location of interpreters installed on the current system, mandatory parameter
	}

}           				            
             
			    


				



























				