server {
	listen 8080;
	server_name localhost;
	root ./www;

	location / {
		root ./www;
		allow_methods GET;
		index index.html;
	}

	location /directory {
		root ./tests/YoupiBanane;
		allow_methods GET POST;
		index youpi.bad_extension;
		autoindex on;
		cgi_extension .bla;
		cgi_path ./cgi_test;
	}

	location /post_body {
		root ./www;
		allow_methods POST;
		client_max_body_size 100;
	}
}
