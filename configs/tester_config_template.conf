server {
	server_name Server42;
	listen 8081;
	root ./YoupiBanane;

	location /nop {
		index youpi.bad_extension;
		allow_methods GET;
		alias directory;
	}
	location / {
		index youpi.bad_extension;
		allow_methods GET;
	}
	location /put_test {
		index youpi.bad_extension;
		allow_methods PUT;
	}
	location /post_body {
		index youpi.bad_extension;
		allow_methods POST;
		client_max_body_size 100;
		cgi_ext  .bla;
		cgi_path /usr/bin/php-cgi;
	}
	location /post_body/holamundo {
		index youpi.bad_extension;
		client_max_body_size 100;
	}
	location /images {
		root /images/images2/hola.py;
	}
	location /directory {
		root ./YoupiBanane;
		allow_methods  GET;
		index youpi.bad_extension;
		cgi_ext  .bla;
		cgi_path ./cgi_tester;
	}
}